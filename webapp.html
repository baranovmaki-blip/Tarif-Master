<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тарифы Билайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --yellow: #FFD600;
    --black: #1A1A1A;
    --white: #FFFFFF;
    --gray: #8a8a8a;
    --card-bg: #262626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .container { padding: 16px; max-width: 480px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 20px; }
  .header .logo { font-size: 22px; font-weight: 800; color: var(--yellow); letter-spacing: 0.5px; }
  .header .subtitle { font-size: 13px; color: var(--gray); margin-top: 4px; }

  .card {
    background: var(--card-bg);
    border: 1px solid #3a3a3a;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .card:active { border-color: var(--yellow); }
  .card .name { font-size: 17px; font-weight: 700; color: var(--white); }
  .card .meta { font-size: 14px; color: var(--yellow); margin-top: 4px; font-weight: 600; }
  .card .short { font-size: 13px; color: var(--gray); margin-top: 6px; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--yellow);
    font-size: 15px;
    font-weight: 600;
    padding: 8px 0 16px;
    cursor: pointer;
  }

  .detail-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--yellow);
    margin-bottom: 16px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #333;
    font-size: 15px;
  }
  .stat-row .label { color: var(--gray); }
  .stat-row .value { color: var(--white); font-weight: 600; }

  .detail-desc {
    margin: 16px 0 24px;
    font-size: 14px;
    line-height: 1.5;
    color: #cfcfcf;
  }

  .buy-btn {
    display: block;
    width: 100%;
    background: var(--yellow);
    color: var(--black);
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  .buy-btn:active { opacity: 0.85; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="container">

  <!-- ===== Экран 1: список тарифов ===== -->
  <div id="catalog-screen">
    <div class="header">
      <div class="logo">⚡ ТАРИФЫ БИЛАЙН</div>
      <div class="subtitle">Официальный партнёр</div>
    </div>
    <div id="catalog-list"></div>
  </div>

  <!-- ===== Экран 2: карточка тарифа ===== -->
  <div id="detail-screen" class="hidden">
    <button class="back-btn" onclick="showCatalog()">← Назад</button>
    <div class="detail-name" id="detail-name"></div>
    <div class="stat-row"><span class="label">💰 Цена</span><span class="value" id="detail-price"></span></div>
    <div class="stat-row"><span class="label">📶 Интернет</span><span class="value" id="detail-gb"></span></div>
    <div class="stat-row"><span class="label">📞 Минуты</span><span class="value" id="detail-minutes"></span></div>
    <div class="stat-row"><span class="label">💬 SMS</span><span class="value" id="detail-sms"></span></div>
    <div class="detail-desc" id="detail-desc"></div>
    <button class="buy-btn" id="buy-btn" onclick="buyTariff()">🟡 КУПИТЬ ЗА 1500 ₽</button>
  </div>

</div>

<script>
  // Плата за подключение — фиксированная, одна и та же для любого тарифа
  // (совпадает с CONNECTION_FEE_RUB в bot.py). Сама цена тарифа — это то,
  // сколько клиент будет платить оператору ежемесячно, это другая величина.
  const CONNECTION_FEE = 1500;

  // Тарифы Билайн — реальные, с mycompany.beeline.ru (те же данные, что и в
  // TARIFFS в bot.py — держите оба списка в синхроне при правках).
  // gb: число ГБ либо строка "безлимит". minutes/sms: число либо null, если
  // оператор не показывает эту цифру для тарифа.
  const TARIFFS = [
    { name: "Пробизнес 1.0 (600 мин)",  price: 229,  gb: "безлимит", minutes: 600,  sms: 300,  short: "Скидка 25% на первые 12 месяцев" },
    { name: "Пробизнес 1.0 (900 мин)",  price: 270,  gb: "безлимит", minutes: 900,  sms: 300,  short: "Скидка 25% на первые 12 месяцев" },
    { name: "Решение за 300",           price: 305,  gb: "безлимит", minutes: 500,  sms: 100,  short: "Безлимитный интернет по доступной цене" },
    { name: "Пробизнес 3.0 (2000 мин)", price: 364,  gb: "безлимит", minutes: 2000, sms: 1000, short: "Скидка 35% на первые 12 месяцев" },
    { name: "Решение за 400",           price: 407,  gb: 35,         minutes: 800,  sms: 300,  short: "35 ГБ плюс безлимитный интернет по России" },
    { name: "Пробизнес 2.0 (1500 мин)", price: 460,  gb: "безлимит", minutes: 1500, sms: 500,  short: "Баланс интернета и звонков для бизнеса" },
    { name: "Гибкий интернет 2.0",      price: 500,  gb: "безлимит", minutes: null, sms: null, short: "Безлимитный интернет, звонки на Билайн бесплатно" },
    { name: "Решение за 550",           price: 559,  gb: 60,         minutes: 1800, sms: 1000, short: "Много интернета и SMS для активного общения" },
    { name: "Пробизнес 3.0 (2500 мин)", price: 610,  gb: "безлимит", minutes: 2500, sms: 1000, short: "Для среднего бизнеса" },
    { name: "Пробизнес 3.0 (3000 мин)", price: 715,  gb: "безлимит", minutes: 3000, sms: 1000, short: "Для активного бизнес-общения" },
    { name: "Пробизнес 3.0 (5000 мин)", price: 1020, gb: "безлимит", minutes: 5000, sms: 1000, short: "Много минут для компании" },
    { name: "Пробизнес 3.0 (6000 мин)", price: 3000, gb: "безлимит", minutes: 6000, sms: 2000, short: "Максимум минут и SMS" },
  ];

  function fmtGb(gb) {
    return gb === "безлимит" ? "Безлимит" : gb + " ГБ";
  }
  function fmtMinutes(minutes) {
    return minutes == null ? "—" : minutes + " минут";
  }
  function fmtSms(sms) {
    return sms == null ? "—" : sms + " SMS";
  }

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    // Не все версии клиента поддерживают эти вызовы — не должны ломать страницу.
    try { tg.setHeaderColor("#1A1A1A"); } catch (e) {}
    try { tg.setBackgroundColor("#1A1A1A"); } catch (e) {}
  }

  let selectedTariff = null;

  function renderCatalog() {
    const list = document.getElementById("catalog-list");
    list.innerHTML = "";
    TARIFFS.forEach((t, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => showDetail(i);
      card.innerHTML = `
        <div class="name">${t.name}</div>
        <div class="meta">${t.price} ₽/мес · ${fmtGb(t.gb)}</div>
        <div class="short">${t.short}</div>
      `;
      list.appendChild(card);
    });
  }

  function showDetail(index) {
    selectedTariff = TARIFFS[index];
    document.getElementById("detail-name").textContent = "📌 " + selectedTariff.name.toUpperCase();
    document.getElementById("detail-price").textContent = selectedTariff.price + " ₽/мес";
    document.getElementById("detail-gb").textContent = fmtGb(selectedTariff.gb);
    document.getElementById("detail-minutes").textContent = fmtMinutes(selectedTariff.minutes);
    document.getElementById("detail-sms").textContent = fmtSms(selectedTariff.sms);
    document.getElementById("detail-desc").textContent = selectedTariff.short + ".";
    document.getElementById("buy-btn").textContent = "🟡 КУПИТЬ ЗА " + CONNECTION_FEE + " ₽";

    document.getElementById("catalog-screen").classList.add("hidden");
    document.getElementById("detail-screen").classList.remove("hidden");
    if (tg) tg.BackButton.show();
  }

  function showCatalog() {
    document.getElementById("detail-screen").classList.add("hidden");
    document.getElementById("catalog-screen").classList.remove("hidden");
    if (tg) tg.BackButton.hide();
  }

  function buyTariff() {
    if (!selectedTariff) return;
    if (tg) {
      tg.sendData(JSON.stringify({
        action: "buy_tariff",
        tariff: selectedTariff.name,
        price: String(CONNECTION_FEE),
      }));
      tg.close();
    } else {
      // Открыто вне Telegram (например, в обычном браузере при отладке) —
      // sendData недоступен, просто предупреждаем.
      alert("Откройте это приложение через кнопку в Telegram-боте.");
    }
  }

  if (tg) tg.BackButton.onClick(showCatalog);

  renderCatalog();
</script>

</body>
</html>
